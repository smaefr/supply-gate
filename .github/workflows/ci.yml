name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest

  supply-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Supply-chain gate
        uses: ./
        with:
          path: .
          threshold: "8.0"
          format: markdown
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-gate
          path: |
            supply-gate.sarif
            supply-gate.md
            sbom.cdx.json
